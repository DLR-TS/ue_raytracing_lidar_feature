; RT Lidar test scene: two stationary sensors, a visualizer and an OSI logger.
; Producer schema: ue_raytracing_lidar_feature:<SensorName>.
; Input references the complete sensor section name without its outer section
; brackets. Write a list as [Producer1,Producer2].
; The name after ':' is arbitrary, but must match in all Input references.
; Boolean values: true or false. Use decimal points and omit units in values.
; Numeric Lidar parameters must be finite (no NaN or Infinity).
; Keep comments on separate lines so they do not become part of a value.

; Rotating 360-degree sensor: 32 * 1024 = 32768 rays per scan.
[ue_raytracing_lidar_feature:Roof_360]
; Optional WEATHERDATA producer list: [weather] or [] for no weather source.
; Enable ue_weather_effect_feature in the experience when connecting [weather].
; Like regular Lidar, the manager shares the latest weather with all its sensors.
; When bWeatherEffectEnabled is true in WEATHERDATA, apply the regular Lidar range degradation
; to outgoing SensorView reflections before interface delivery.
WeatherInput=[]
; Sensor origin height in cm; here 150 cm = 1.5 m above the world origin.
; Without Mount, positions are world coordinates; with Mount, relative to its target.
; Finite number, no explicit minimum/maximum; negative values are allowed.
MountingPositionZ=150
; Scan pattern: Rotating | Raster | Flash | Lissajous | Custom.
; Rotating samples all vertical channels at each azimuth step.
ScanPattern=Rotating
; All patterns: requested scans per simulation second; finite and >= 1/60 Hz, no fixed upper limit.
; Logical scan duration is always 1 / UpdateRateHz (here 0.05 s, maximum 60 s).
; Ray timestamps and motion distortion use this duration; geometry uses one GPU dispatch.
; At most one new scan per game frame; full GPU buffers can cause dropped scans.
UpdateRateHz=20
; Rotating only: number of vertical rings; integer 1..65536.
; RotatingChannels * HorizontalResolution must be between 1 and 1048576.
RotatingChannels=32
; Rotating/Raster/Flash only: horizontal samples; here azimuth steps per scan.
; Positive integer, limited by the ray count above.
HorizontalResolution=1024
; Horizontal angular range in degrees; > 0 and <= 360.
; Rotating starts at RotatingStartAzimuthDegrees (default 0), without a duplicate endpoint.
HorizontalFovDegrees=360
; Vertical angular range in degrees; > 0 and < 180, here -20 to +20 degrees.
; Rotating distributes channels uniformly; RotatingVerticalAngles can override this.
VerticalFovDegrees=40
; Minimum measurement distance in m; >= 0 and strictly less than MaxRangeMeters.
MinRangeMeters=0.3
; Maximum measurement distance in m; > MinRangeMeters and <= 100000.
MaxRangeMeters=50
; Standard deviation of additive Gaussian range noise in m; >= 0.
; 0 disables noise; for example, 0.005 means a standard deviation of 5 mm.
RangeNoiseStdDevMeters=0

; Front sensor: uniform angular raster with 129 * 33 = 4257 rays per scan.
; Unspecified options retain their defaults: Projection=Angular,
; MotionDistortionEnabled=false, MaterialResponseEnabled=true, Enabled=true.
[ue_raytracing_lidar_feature:Front_Raster]
; Optional weather source, shared by the manager: [weather] | []. See Roof_360 above.
;WeatherInput=[]
; Sensor height in cm; finite number without fixed limits; world coordinates without Mount.
MountingPositionZ=150
; Rotating | Raster | Flash | Lissajous | Custom; Raster samples an angular grid.
; Projection=Angular (default) | Rectilinear; Rectilinear requires both FOVs < 180.
ScanPattern=Raster
; Rotating/Raster/Flash only: horizontal samples; here raster points.
; Positive integer. A value of 1 places the raster ray at the center.
; HorizontalResolution * VerticalResolution must be between 1 and 1048576.
HorizontalResolution=129
; Raster/Flash only: vertical raster points; positive integer, limited by the total ray count.
; A value of 1 places the ray at the center; larger values include both FOV edges.
VerticalResolution=33
; Horizontal field of view in degrees; > 0 and <= 360 (Rectilinear: < 180).
; Angular distributes points from -FOV/2 to +FOV/2.
HorizontalFovDegrees=170
; Vertical field of view in degrees; > 0 and < 180; here -30 to +30 degrees.
VerticalFovDegrees=60
; All patterns: requested scans per simulation second; finite and >= 1/60 Hz.
; Derived logical duration: 1 / UpdateRateHz = 0.1 s; at most one scan per game frame.
UpdateRateHz=10
; Minimum measurement distance in m; >= 0 and < MaxRangeMeters.
MinRangeMeters=0.3
; Maximum measurement distance in m; > MinRangeMeters and <= 100000.
MaxRangeMeters=50
; Gaussian range noise: standard deviation in m, >= 0; 0 disables it.
RangeNoiseStdDevMeters=0

[ue_visualizer_feature]
; List of SensorView producers: complete sensor section names, or [].
; Only Front_Raster is used here: the visualizer reconstructs a uniform angular
; raster instead of reading the individual ray directions of the Rotating sensor.
Input=[ue_raytracing_lidar_feature:Front_Raster]
; Display the camera image from a CameraSensorView: true | false; no effect for Lidar.
ShowCamera=false
; Display the field of view of incoming sensors: true | false.
ShowFoV=true
; Dimensionless marker mesh scale factor, not a length in m or cm.
; No parser limits; use positive values, 0 makes markers invisible.
; Resulting size depends on the mesh; markers here are approximately 6 cm across.
MarkerScale=0.2
; Mount target for the visualizer camera: producer/object name resolved as a mount
; target by an active manager. Empty = unmounted camera using the world positions below.
Mount=
; List of TrafficUpdate producers for vehicle trails; [] = no source.
; Do not use Lidar producers here: they provide SensorView, not TrafficUpdate.
TraceInput=[]
; Draw vehicle trails: true | false; no trails are drawn without TraceInput.
DrawTraces=true
; Camera view: FirstPerson | SecondPerson | ThirdPerson.
; FirstPerson has no spring arm distance and uses the following offsets.
FollowVehicleType=ThirdPerson
; Camera X in cm, forward; relative to Mount if set, otherwise a world position.
; Finite number recommended, no explicit parser limits; negative values are allowed.
FirstPersonLocationX=0
; Camera Y in cm, right; same reference frame and limits as X.
FirstPersonLocationY=0
; Camera Z in cm, up; same reference frame and limits as X.
FirstPersonLocationZ=400
; Camera pitch in degrees; negative values look down. No explicit parser limit;
; use -90..90 for a conventional view; other finite angles are accepted.
FirstPersonPitch=-12
; Camera rotation around Z in degrees; positive values turn towards +Y.
; No explicit parser limit; angles are periodic (360 degrees = one full turn).
FirstPersonYaw=15

[ue_logger_feature]
; Also record global OSI GroundTruth: true | false.
GroundTruth=false
; Verbose diagnostic output in the Unreal log: true | false.
Debug=false
; Producer list using the same schema as Visualizer.Input.
; Order and count must match InputData exactly; [] = no sensor source.
Input=[ue_raytracing_lidar_feature:Roof_360,ue_raytracing_lidar_feature:Front_Raster]
; Data type for each Input: SensorView | SensorData. RT Lidar provides SensorView.
; One entry per producer, at the same list position.
InputData=[SensorView,SensorView]
; Arbitrary filename suffix without .osi; not a path and has no physical unit.
; Use filesystem-valid characters. The logger adds a timestamp/type/version
; and writes OSI files to Output when the simulation ends.
FileName=RT_LIDAR_TEST_MAP
